<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/components/variables.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rubik:ital,wght@0,300..900;1,300..900&family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components/header.css">
    <title>Syntaxware - Loja de Tênis</title>
</head>
<body>
    <header class="header">
        <div class="Logo">
            <!-- Logo -->
             <h1>
                <a href="/" title="Syntaxware - Loja de Tênis e Sneakers Online">
                    <img src="./images/logo/logo.png" alt="Syntaxware - Loja de Tênis" class="header__logo-image">
                </a>
             </h1>

        </div>

        <nav class="nav-center" aria-label="Navegação principal">
            <!-- Links de navegação -->
             <ul>
                <li><a href="#">Masculino</a></li>
                <li><a href="#">Feminino</a></li>
                <li><a href="#">Outlet</a></li>
             </ul>
        </nav>

        <nav class="nav-right" aria-label="Links auxiliares">
            <ul>
                <li><a href="#">Nossas lojas</a></li>
                <li><a href="#">Sobre</a></li>
                <li>
                    <a href="#" aria-label="Minha conta">
                        <img src="./images/icons/Usuario.svg" alt="Minha conta">
                        
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Ajuda">
                        <img src="./images/icons/Ajuda.svg" alt="Ajuda">
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Sacola de compras">
                        <img src="./images/icons/Carrinho.svg" alt="Sacola de compras">
                        
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <!-- Conteúdo principal da seção hero -->
        </section>

        <section class="categories" aria-labelledby="categories-title">
            <!-- Categorias de tênis -->
             
        </section>

        <section class="featured-products" aria-labelledby="featured-products-title">
            <div class="featured-products__grid">
                <!-- Grade de produtos em destaque -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <address class="footer__contact">
            <!-- Informações de contato -->
        </address>

        <nav class="footer__links" aria-label="Links do rodapé">
            <!-- Links institucionais e de suporte -->
        </nav>
    </footer>
</body>
</html>
