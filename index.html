<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Ecommerce syntaxware</title>
</head>
<body>
    <header class="header">
        <div class="header__logo">
            <!-- Logo -->
        </div>

        <nav class="header__navigation" aria-label="Navegação principal">
            <!-- Links de navegação -->
        </nav>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <!-- Conteúdo principal da seção hero -->
        </section>

        <section class="categories" aria-labelledby="categories-title">
            <!-- Categorias de tênis -->
        </section>

        <section class="featured-products" aria-labelledby="featured-products-title">
            <div class="featured-products__grid">
                <!-- Grade de produtos em destaque -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <address class="footer__contact">
            <!-- Informações de contato -->
        </address>

        <nav class="footer__links" aria-label="Links do rodapé">
            <!-- Links institucionais e de suporte -->
        </nav>
    </footer>
</body>
</html>
